name: Report a bug
description: Something in the game does not work the way it should.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The more of this form you fill in, the faster the bug can be found and fixed.

        **Tip:** write your game version (it is on the download page) and your device in the box below.
  - type: textarea
    id: debug-info
    attributes:
      label: Game version and device
      description: For example, the game version, your platform and device, and the frame rate setting (30 or 60).
      placeholder: |
        Game version: 1.1.0
        Platform: android 14
        Device: Samsung SM-A546B
        Frame rate: 60 FPS
      render: text
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where in the game?
      options:
        - Racing (jumping, running, the map itself)
        - Bots
        - Power-ups
        - Quick Play lobby or results
        - 2 vs 2
        - Practice
        - LAN races with friends
        - Clans
        - Leagues
        - Shop, items or wings
        - Daily spin
        - Menus, buttons or layout
        - PC controls (keyboard or mouse)
        - Saves or progress
        - Sound or music
        - Tutorial
        - Something else
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem in your own words.
      placeholder: My runner fell through the floor right after the second jump pad.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      description: The exact steps, starting from the main menu. Name the map if it happens in a race.
      placeholder: |
        1. Play > Quick Play
        2. Vote for Frosty Forest
        3. Use a rocket right after the first slope
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Often
        - Sometimes
        - It happened once
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console log or error text
      description: |
        If an error box appeared, copy its text. Logs help a lot:
        - **Solar2D Simulator / PC:** copy the lines from the console window.
        - **Android:** connect the phone and run `adb logcat -s Corona` while it happens.
        - **iOS:** open the device console in Xcode (Window > Devices and Simulators).
      render: text
    validations:
      required: false
  - type: textarea
    id: media
    attributes:
      label: Screenshots or a short video
      description: Drag files here. A video of the moment it goes wrong is the most useful thing you can add.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I searched the open issues and this is not already reported.
          required: true
        - label: I am using the latest release (or say which version you use above).
          required: false
        - label: I removed private information (passwords, emails, real names) from what I shared.
          required: true
