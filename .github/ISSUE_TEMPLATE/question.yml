name: Ask a question
description: Get help with playing, building or contributing to the project.
title: "Question: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Share what you are trying to do. Please do not include passwords or private account information. For a quick chat, the Discord server (linked on the previous page) is often faster.
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Playing the game
        - Installing or updating
        - Running the project in Solar2D
        - Building for Android, iOS or Windows
        - Contributing code or art
        - Something else
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: What do you need help with?
      placeholder: Explain what you are trying to do and where you are stuck.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried so far?
    validations:
      required: false
  - type: textarea
    id: debug-info
    attributes:
      label: Game version and device (if the game runs)
      description: Your game version and device.
      render: text
    validations:
      required: false
